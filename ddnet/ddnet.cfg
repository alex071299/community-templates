# DDNet / TClient - Noctalia palette
# The UI color also affects in-game interface elements.
ui_color ${{ colors.primary_container.default.hex_stripped }}E4

# Game background (these do not replace the main menu's background map)
cl_background_color ${{ colors.surface.default.hex_stripped }}
cl_background_entities_color ${{ colors.surface_variant.default.hex_stripped }}

# Chat background and text
cl_chat_background_color ${{ colors.surface.default.hex_stripped }}B8
cl_message_color ${{ colors.on_surface.default.hex_stripped }}
cl_message_client_color ${{ colors.on_surface_variant.default.hex_stripped }}
cl_message_system_color ${{ colors.secondary.default.hex_stripped }}
cl_message_highlight_color ${{ colors.primary.default.hex_stripped }}
cl_message_friend_color ${{ colors.tertiary.default.hex_stripped }}

# Scoreboard (authenticated players and players sharing your clan)
cl_authed_player_color ${{ colors.tertiary.default.hex_stripped }}
cl_same_clan_color ${{ colors.secondary.default.hex_stripped }}

# Kill messages
cl_kill_message_normal_color ${{ colors.on_surface.default.hex_stripped }}
cl_kill_message_highlight_color ${{ colors.primary.default.hex_stripped }}
